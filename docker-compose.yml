services:
  scraper:
    build:
      context: .
    image: books-scraper:latest
    container_name: books-scraper
    command: python main.py --max-pages 0
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - SCRAPER_MAX_CONCURRENT=5
      - SCRAPER_REQUEST_DELAY=0.2
    restart: "no"
